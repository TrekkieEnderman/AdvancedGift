# Configuration version. Please don't touch. I will ridicule you if you do and then
# come to me for support when the plugin behaves strangely. Only half-joking.
version: 2

# How you want the plugin name to be displayed in chat. Leave it blank to hide the name.
prefix: '&6[AdvancedGift]'

# Allows the plugin to share some data about itself and the server using it with BStats.
# Shared data will not include any private or secure information.
enable-metrics: true

# Server language the plugin should translate messages in.
# Currently, the plugin only have translations for 'en_US' and 'sas_SY', both English,
# but will give you a copy of the base translation file for any chosen locale for editing.
# Generated translation files could be found in 'translations' folder in the same place as this config file.
locale: en_us

# Adds a cooldown period between gifts. The cooldown is enforced per-player.
cooldown:
  enabled: false
  duration: 10 # Amount in SECONDS

# Set this false to completely remove the messaging feature for everyone.
allow-gift-message: true

# A basic filter system to catch offending gift messages.
message-censorship:
  enabled: false
  # How the plugin should handle offending gift messages.
  # Your options are to CENSOR the message, REMOVE it, or DENY the entire gift.
  mode: REMOVE
  # A list of offensive words the plugin should look out for in gift messages.
  # Wildcards (*) are supported. Placing them on either or both ends of a word will affect
  # how it is compared to words in a gift message.
  #
  # NOTE: Words starting with a wildcard MUST be surrounded by quotes or
  # the config file will become unparsable!
  filter:
    - fuck*
    - shit*
    - ass
    - dumbass
    - bitch
    - bastard

# Places a restriction on gifts that go between worlds. This is useful if
# your server has custom worlds with separate inventories.
interworld-restriction:
  enabled: false
  # Here you can choose which group each world belongs to.
  # When restricted, gifts that have a destination in a world group different from their origin group will be denied.
  # Any world not listed ia considered blacklisted and all gifts sending to, from and within the world will be denied.
  # You can have any number of groups and any number of worlds in each group.
  # Keep in mind if you put a world in two or more groups, only the first group the world is
  # listed in will be considered when the plugin evaluates the groups for a gift's origin and destination worlds.
  # Name each group whatever you want. The plugin doesn't care as long as the file remains parsable.
  world-groups:
    example-group:
      - example_world
    group:
      - world
      - world_nether
      - world_the_end