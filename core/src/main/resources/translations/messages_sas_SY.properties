giftCommandDescription=<yellow>Send your friend or foe a gift anywhere and anytime in an instant!
giftCommandUsage=<yellow>Hold something in your hand and type in the chat <white>/gift <yellow>following by <white>the name of the player <yellow>you wish to send a gift to.\n\
You may use the player's full name or any part of it, and the plugin will do its best to find the right player, or list them in the chat if more than one match is found. Clicking on one of the listed name will autofill your chat with the exact command for them.\n\
By default the entire item in your hand will be sent, but you may specify <white>an amount <yellow>of the item to be sent or <white>all <yellow>of them. <white>Hand <yellow>is also accepted, and will send only the item in your hand.\n\
You also may include a message to be sent along with the gift. To add a message, you must include an amount following by your message.\n \n\
<gold>Examples of command usage:\n\
<white>/gift Trekkie <yellow>will send Trekkie whatever you have in your hand.\n\
<white>/gift Trekkie 16 <yellow>will send Trekkie exactly 16 of the held item.\n\
<white>/gift Trekkie all <yellow>will send Trekkie all item in your inventory that matches the held item.\n\
<white>/gift Trekkie hand Here you go! <yellow>will send Trekkie your held item along with a message that says "Here you go!"
